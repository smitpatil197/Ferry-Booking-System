<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Ferry | Ferry Booking</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">FerryBooking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="book.html">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="booking-container">
    <div class="booking-card container mx-auto my-5 p-4">
      <div class="booking-form">
        <h2>Book Your Ferry Ticket</h2>
        <form id="booking-form">
          <label for="ferrySelect">Select Ferry</label>
          <select id="ferrySelect" required>
            <option value="" disabled selected>Select a ferry</option>
            <option value="Maldar">Maldar Ferry - ₹300</option>
            <option value="PNP">PNP Ferry - ₹350</option>
            <option value="Apolo">Apolo Ferry - ₹200</option>
            <option value="Ajanta">Ajanta Ferry - ₹180</option>
          </select>

          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required />

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter your phone number" required />

          <label for="date">Travel Date</label>
          <input type="date" id="date" required />

          <label for="passengers">Number of Passengers</label>
          <input type="number" id="passengers" min="1" max="10" value="1" required />

          <button type="submit">Confirm Booking</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External Script -->
  <script src="script.js"></script>
</body>
</html>
